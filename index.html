function wInfo(code) {
  const item = WEATHER_CODES[code] || {
    ar: 'حالة جوية غير معروفة',
    en: 'Unknown conditions',
    fr: 'Conditions inconnues',
    i: 'cloud'
  };

  return {
    t: item[currentLang] || item.en,
    i: item.i
  };
}

function skyInfo(code, cloud, isDay) {
  if ((code === 0 || code === 1) && cloud != null) {
    if (!isDay) {
      return {
        t: currentLang === 'ar' ? 'صافي ليلًا' :
           currentLang === 'fr' ? 'Ciel dégagé la nuit' : 'Clear night',
        i: 'moon'
      };
    }

    return {
      t: currentLang === 'ar' ? 'مشمس' :
         currentLang === 'fr' ? 'Ensoleillé' : 'Sunny',
      i: 'sun'
    };
  }

  return wInfo(code);
}

function getWindDirection(degrees) {
  if (!Number.isFinite(degrees)) return '--';

  const directions = tr('windDirections');
  const index = Math.round(((degrees % 360) / 45)) % 8;
  return directions[index];
}

function initApp() {
  const btn = document.getElementById('refreshBtn');
  btn.classList.add('spin');

  document.getElementById('weatherState').textContent = tr('loading');
  document.getElementById('cityName').textContent = tr('locationLoading');

  fetchSupabaseAlerts();

  const done = () => btn.classList.remove('spin');

  if (!navigator.geolocation) {
    fetchWeatherData(43.7102, 7.2620, 'Nice, France')
      .finally(done);
    return;
  }

  navigator.geolocation.getCurrentPosition(
    position => {
      const lat = position.coords.latitude;
      const lon = position.coords.longitude;

      fetchWeatherData(
        lat,
        lon,
        `${lat.toFixed(2)}, ${lon.toFixed(2)}`
      ).finally(done);
    },
    () => {
      fetchWeatherData(43.7102, 7.2620, 'Nice, France')
        .finally(done);
    },
    {
      timeout: 10000,
      maximumAge: 300000,
      enableHighAccuracy: false
    }
  );
}

async function fetchWeatherData(lat, lon, locationLabel) {
  const requestId = ++weatherRequestId;

  try {
    const params = new URLSearchParams({
      latitude: String(lat),
      longitude: String(lon),
      current: [
        'temperature_2m',
        'relative_humidity_2m',
        'wind_speed_10m',
        'wind_direction_10m',
        'weather_code',
        'cloud_cover',
        'is_day'
      ].join(','),
      hourly: 'temperature_2m,weather_code',
      daily: 'temperature_2m_max,temperature_2m_min,weather_code,sunrise,sunset',
      forecast_days: '7',
      timezone: 'auto'
    });

    const response = await fetch(
      `https://api.open-meteo.com/v1/forecast?${params}`
    );

    if (!response.ok) {
      throw new Error(`Weather API HTTP ${response.status}`);
    }

    const data = await response.json();

    if (requestId !== weatherRequestId) return;
    if (!data.current || !data.hourly || !data.daily) {
      throw new Error('Incomplete weather response');
    }

    latestWeather = {
      data,
      lat,
      lon,
      locationLabel
    };

    globalUtcOffset = Number(data.utc_offset_seconds) || 0;

    globalSunrise = data.daily.sunrise?.[0]?.slice(11, 16) || null;
    globalSunset = data.daily.sunset?.[0]?.slice(11, 16) || null;

    resetSunAlertsIfNewDay(data.daily.time?.[0] || '');
    renderWeather(latestWeather);
    applyDynamicTheme(
      data.current.temperature_2m,
      data.current.weather_code,
      data.current.is_day
    );

    initRadarMap(lat, lon);
  } catch (error) {
    console.error('Weather loading error:', error);

    if (requestId === weatherRequestId) {
      document.getElementById('weatherState').textContent = tr('weatherError');
    }
  }
}

function renderWeather(weather) {
  if (!weather) return;

  const { data, locationLabel } = weather;
  const current = data.current;
  const temp = Math.round(current.temperature_2m);
  const wind = current.wind_speed_10m;
  const humidity = current.relative_humidity_2m;
  const windDirection = current.wind_direction_10m;
  const code = current.weather_code;

  const info = skyInfo(
    code,
    current.cloud_cover,
    current.is_day
  );

  document.getElementById('cityName').textContent = locationLabel;
  document.getElementById('tempDegree').textContent = `${temp}°`;
  document.getElementById('windSpeed').textContent =
    `${Math.round(wind)} ${tr('windUnit')}`;
  document.getElementById('humidity').textContent =
    `${Math.round(humidity)}%`;
  document.getElementById('windDir').textContent =
    getWindDirection(windDirection);
  document.getElementById('weatherState').textContent = info.t;

  document.getElementById('weatherIcon').innerHTML =
    `<i data-lucide="${info.i}" style="width:65px;height:65px;color:var(--primary-cyan)"></i>`;

  renderAdvice(temp, code);
  renderHourly(data);
  renderDaily(data);

  lucide.createIcons();
}

function renderAdvice(temp, code) {
  let advice;

  if ([95, 96, 99].includes(code)) {
    advice = tr('stormTip');
  } else if (
    (code >= 51 && code <= 67) ||
    (code >= 80 && code <= 82)
  ) {
    advice = tr('rainTip');
  } else if (temp >= 30) {
    advice = tr('hotTip');
  } else if (temp <= 15) {
    advice = tr('coldTip');
  } else {
    advice = tr('mildTip');
  }

  document.getElementById('aiAdvice').textContent =
    `${tr('weatherSource')}. ${advice}`;
}

function renderHourly(data) {
  const container = document.getElementById('hourlyContainer');
  container.replaceChildren();

  const hourly = data.hourly;
  const currentTime = data.current.time || '';
  let start = hourly.time.findIndex(
    time => time.slice(0, 13) === currentTime.slice(0, 13)
  );

  if (start < 0) {
    start = hourly.time.findIndex(time => time >= currentTime);
  }
  if (start < 0) start = 0;

  const labels = [];
  const temps = [];

  for (let i = start; i < Math.min(start + 24, hourly.time.length); i++) {
    const temp = hourly.temperature_2m[i];
    const time = hourly.time[i].slice(11, 16);
    const info = wInfo(hourly.weather_code[i]);

    labels.push(time);
    temps.push(Math.round(temp));

    const card = document.createElement('div');
    card.className = 'hour-card';

    const timeEl = document.createElement('span');
    timeEl.className = 'hour-time';
    timeEl.textContent = time;

    const icon = document.createElement('i');
    icon.dataset.lucide = info.i;
    icon.style.cssText = 'width:20px;height:20px;color:var(--primary-cyan)';

    const tempEl = document.createElement('span');
    tempEl.className = 'hour-temp';
    tempEl.textContent = `${Math.round(temp)}°`;

    card.append(timeEl, icon, tempEl);
    container.appendChild(card);
  }

  renderTempChart(labels, temps);
  lucide.createIcons();
}

function renderDaily(data) {
  const container = document.getElementById('dailyContainer');
  container.replaceChildren();

  const daily = data.daily;

  for (let i = 0; i < daily.time.length; i++) {
    const date = new Date(`${daily.time[i]}T12:00:00`);
    const dayName = new Intl.DateTimeFormat(currentLang, {
      weekday: 'long'
    }).format(date);

    const info = wInfo(daily.weather_code[i]);
    const row = document.createElement('div');
    row.className = 'day-row';

    const day = document.createElement('span');
    day.className = 'day-name';
    day.textContent = dayName;

    const icon = document.createElement('i');
    icon.dataset.lucide = info.i;
    icon.style.cssText = 'width:20px;height:20px;color:var(--primary-cyan)';

    const temps = document.createElement('span');
    temps.className = 'day-temp';
    temps.textContent =
      `${Math.round(daily.temperature_2m_max[i])}° / ${Math.round(daily.temperature_2m_min[i])}°`;

    row.append(day, icon, temps);
    container.appendChild(row);
  }

  lucide.createIcons();
}

function renderTempChart(labels, temps) {
  const canvas = document.getElementById('tempChart');
  if (!canvas || !window.Chart) return;

  if (tempChartInstance) {
    tempChartInstance.destroy();
  }

  const ctx = canvas.getContext('2d');
  const cyan = getComputedStyle(document.documentElement)
    .getPropertyValue('--primary-cyan').trim() || '#00f2fe';

  const gradient = ctx.createLinearGradient(0, 0, 0, 220);
  gradient.addColorStop(0, `${cyan}55`);
  gradient.addColorStop(1, `${cyan}00`);

  tempChartInstance = new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [{
        label: tr('chartTemp'),
        data: temps,
        borderColor: cyan,
        borderWidth: 3,
        pointBackgroundColor: '#fff',
        pointBorderColor: cyan,
        pointRadius: 3,
        fill: true,
        backgroundColor: gradient,
        tension: 0.35
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { intersect: false, mode: 'index' },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: 'rgba(22,27,34,.95)'
        }
      },
      scales: {
        x: {
          grid: { display: false },
          ticks: {
            color: '#a0aec0',
            maxTicksLimit: 8,
            maxRotation: 0
          }
        },
        y: {
          grid: { color: 'rgba(255,255,255,.08)' },
          ticks: { color: '#a0aec0' }
        }
      }
    }
  });
}

/* =========================
   6. خريطة الأمطار
========================= */

function initRadarMap(lat, lon) {
  if (!window.L) return;

  const container = document.getElementById('radarMap');
  if (!container) return;

  if (!radarMapInstance) {
    radarMapInstance = L.map(container, {
      zoomControl: true,
      attributionControl: true
    }).setView([lat, lon], 7);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(radarMapInstance);
  } else {
    radarMapInstance.setView([lat, lon], 7);
  }

  if (userMarker) userMarker.remove();

  userMarker = L.marker([lat, lon])
    .addTo(radarMapInstance)
    .bindPopup(tr('locationLabel'));

  loadRainLayer();

  setTimeout(() => {
    radarMapInstance?.invalidateSize();
  }, 250);
}

async function loadRainLayer() {
  if (!radarMapInstance) return;

  const requestId = ++radarRequestId;

  try {
    const response = await fetch(
      'https://api.rainviewer.com/public/weather-maps.json'
    );

    if (!response.ok) {
      throw new Error(`Rain map HTTP ${response.status}`);
    }

    const info = await response.json();
    if (requestId !== radarRequestId) return;

    const frames = info?.radar?.past || [];
    const frame = frames[frames.length - 1];

    if (!frame?.path) {
      throw new Error('No radar frame available');
    }

    const tileUrl =
      `https://tilecache.rainviewer.com${frame.path}/256/{z}/{x}/{y}/2/1_1.png`;

    if (rainLayer) {
      rainLayer.remove();
    }

    rainLayer = L.tileLayer(tileUrl, {
      opacity: 0.65,
      maxZoom: 12,
      attribution: 'RainViewer'
    });

    rainLayer.on('tileerror', () => {
      console.warn('Some precipitation tiles failed to load.');
    });

    rainLayer.addTo(radarMapInstance);
  } catch (error) {
    console.warn('Rain layer unavailable:', error);
    showBanner(tr('radarTitle'), tr('mapError'));
  }
}

/* =========================
   7. التنبيهات من Supabase
========================= */

function escapeHTML(value) {
  return String(value ?? '').replace(/[&<>"']/g, char => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  })[char]);
}

function renderAlerts() {
  const container = document.getElementById('alertsListContainer');
  if (!container) return;

  if (latestAlerts === null) {
    container.innerHTML = `
      <div class="alert-card">
        <div class="alert-header">${escapeHTML(tr('alertsError'))}</div>
        <div class="alert-body">${escapeHTML(tr('alertsErrorDesc'))}</div>
      </div>`;
    return;
  }

  if (latestAlerts.length === 0) {
    container.innerHTML = `
      <div class="alert-card ok">
        <div class="alert-header">
          <i data-lucide="shield-check"></i>
          <span>${escapeHTML(tr('noAlerts'))}</span>
        </div>
        <div class="alert-body">${escapeHTML(tr('noAlertsDesc'))}</div>
      </div>`;
  } else {
    container.innerHTML = latestAlerts.map(alert => `
      <div class="alert-card">
        <div class="alert-header">
          <i data-lucide="siren"></i>
          <span>${escapeHTML(alert.title || 'Weather alert')}</span>
        </div>
        <div class="alert-body">${escapeHTML(alert.message || '')}</div>
      </div>
    `).join('');
  }

  lucide.createIcons();
}

async function fetchSupabaseAlerts() {
  if (!supabaseClient) {
    latestAlerts = null;
    renderAlerts();
    return;
  }

  try {
    const { data, error } = await supabaseClient
      .from('weather_alerts')
      .select('title,message,is_active')
      .eq('is_active', true);

    if (error) throw error;

    latestAlerts = Array.isArray(data) ? data : [];
    renderAlerts();

    if (latestAlerts.length > 0) {
      const first = latestAlerts[0];
      const signature = `${first.title || ''}|${first.message || ''}`;

      document.getElementById('bellBtn').classList.add('has-alert');

      // لا تكرر الصوت والبانر في كل تحديث دوري لنفس التنبيه.
      if (signature !== lastAlertSignature) {
        lastAlertSignature = signature;
        showBanner(first.title || tr('alertsTitle'), first.message || '');
        beep();
      }
    } else {
      lastAlertSignature = '';
      document.getElementById('bellBtn').classList.remove('has-alert');
    }
  } catch (error) {
    console.error('Supabase alerts error:', error);
    latestAlerts = null;
    renderAlerts();
  }
}

/* =========================
   8. بانر وصوت التنبيه
========================= */

function showBanner(title, message) {
  const banner = document.getElementById('alertBanner');

  document.getElementById('abTitle').textContent = title || '';
  document.getElementById('abMsg').textContent = message || '';

  banner.classList.add('show');

  clearTimeout(window._bannerTimer);
  window._bannerTimer = setTimeout(hideBanner, 8000);

  // إشعار محلي فقط إذا كان الإذن ممنوحًا مسبقًا.
  // هذا لا ينشئ Push عند إغلاق الصفحة.
  if ('Notification' in window &&
      Notification.permission === 'granted') {
    try {
      new Notification(title || tr('alertsTitle'), {
        body: message || ''
      });
    } catch (error) {
      console.warn('Local notification unavailable:', error);
    }
  }
}

function hideBanner() {
  document.getElementById('alertBanner').classList.remove('show');
}

let lastBeepAt = 0;

function beep() {
  // تجنب تشغيل أصوات متكررة بفاصل قصير.
  if (Date.now() - lastBeepAt < 3000) return;
  lastBeepAt = Date.now();

  try {
    const AudioContextClass =
      window.AudioContext || window.webkitAudioContext;

    if (!AudioContextClass) return;

    const context = new AudioContextClass();

    if (context.state === 'suspended') {
      context.close();
      return;
    }

    [0, 0.35, 0.7].forEach(delay => {
      const oscillator = context.createOscillator();
      const gain = context.createGain();

      oscillator.type = 'sine';
      oscillator.frequency.value = 880;
      gain.gain.setValueAtTime(0.08, context.currentTime + delay);
      gain.gain.exponentialRampToValueAtTime(
        0.001,
        context.currentTime + delay + 0.2
      );

      oscillator.connect(gain);
      gain.connect(context.destination);
      oscillator.start(context.currentTime + delay);
      oscillator.stop(context.currentTime + delay + 0.22);
    });

    setTimeout(() => context.close().catch(() => {}), 1500);
  } catch (error) {
    console.warn('Audio unavailable:', error);
  }
}

/* =========================
   9. الشروق والغروب
========================= */

function getLocationLocalTime() {
  // نحول الوقت الحالي إلى وقت الموقع باستخدام فرق UTC الذي رجع من API.
  return new Date(Date.now() + globalUtcOffset * 1000);
}

function resetSunAlertsIfNewDay(dateKey) {
  if (!dateKey || sunAlertDate === dateKey) return;

  sunAlertDate = dateKey;
  notifiedSunriseToday = false;
  notifiedSunsetToday = false;
}

function checkSunAlerts() {
  if (!globalSunrise && !globalSunset) return;

  const localNow = getLocationLocalTime();
  const hh = String(localNow.getUTCHours()).padStart(2, '0');
  const mm = String(localNow.getUTCMinutes()).padStart(2, '0');
  const currentMinutes = Number(hh) * 60 + Number(mm);

  const dateKey = latestWeather?.data?.daily?.time?.[0] ||
    `${localNow.getUTCFullYear()}-${localNow.getUTCMonth() + 1}-${localNow.getUTCDate()}`;

  resetSunAlertsIfNewDay(dateKey);

  function nearTarget(target) {
    if (!target) return false;

    const parts = target.split(':').map(Number);
    if (parts.length !== 2 || parts.some(Number.isNaN)) return false;

    const targetMinutes = parts[0] * 60 + parts[1];
    const difference = currentMinutes - targetMinutes;

    // نافذة قصيرة لتقليل احتمال تفويت التنبيه بسبب تأخر المؤقت.
    return difference >= 0 && difference <= 2;
  }

  if (nearTarget(globalSunrise) && !notifiedSunriseToday) {
    notifiedSunriseToday = true;
    showBanner(tr('sunriseAlertTitle'), tr('sunriseAlertMsg'));
  }

  if (nearTarget(globalSunset) && !notifiedSunsetToday) {
    notifiedSunsetToday = true;
    showBanner(tr('sunsetAlertTitle'), tr('sunsetAlertMsg'));
  }
}

/* =========================
   10. ألوان الواجهة
========================= */

function applyDynamicTheme(temp, code, isDay) {
  const container = document.getElementById('appContainer');

  let gradient;
  let bodyColor;
  let accent = '#00f2fe';

  if ([95, 96, 99].includes(code) || (code >= 51 && code <= 82)) {
    gradient = 'linear-gradient(135deg,#0f172a 0%,#1e293b 50%,#0f172a 100%)';
    bodyColor = '#090d16';
    accent = '#38bdf8';
  } else if (temp >= 30 && isDay) {
    gradient = 'linear-gradient(135deg,#3a1510 0%,#4d1d16 50%,#240a07 100%)';
    bodyColor = '#1a0806';
    accent = '#ff7830';
  } else if (temp <= 15) {
    gradient = 'linear-gradient(135deg,#0c2340 0%,#1a3a5c 50%,#081726 100%)';
    bodyColor = '#05101a';
    accent = '#7dd3fc';
  } else if (!isDay) {
    gradient = 'linear-gradient(135deg,#120d1d 0%,#1e172e 50%,#0a0712 100%)';
    bodyColor = '#050308';
    accent = '#c084fc';
  } else {
    gradient = 'linear-gradient(135deg,#0a1f24 0%,#132e35 50%,#061317 100%)';
    bodyColor = '#040d10';
  }

  container.style.background = gradient;
  document.body.style.background = bodyColor;
  document.documentElement.style.setProperty('--primary-cyan', accent);
}

/* =========================
   11. التنقل بين الصفحات
========================= */

function switchPage(pageId, btnElement) {
  document.querySelectorAll('.page-section').forEach(section => {
    section.classList.remove('active');
  });

  document.querySelectorAll('.nav-item').forEach(nav => {
    nav.classList.remove('active');
  });

  const page = document.getElementById(`page-${pageId}`);
  if (!page) return;

  page.classList.add('active');

  const radarBtn = document.getElementById('radarBtn');
  radarBtn.style.borderColor = 'var(--glass-border)';

  if (pageId === 'radar') {
    radarBtn.style.borderColor = 'var(--primary-cyan)';

    setTimeout(() => {
      radarMapInstance?.invalidateSize();
    }, 200);
  } else if (btnElement?.classList.contains('nav-item')) {
    btnElement.classList.add('active');
  }
}

// فحص الشروق والغروب مرة كل 15 ثانية، مع منع تكرار تنبيه اليوم.
setInterval(checkSunAlerts, 15000);

// تحديث أحجام الخريطة عند الرجوع إلى الصفحة.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
