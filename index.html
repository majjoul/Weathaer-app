<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تطبيق الطقس والإنذار الذكي</title>
  <!-- الخطوط وأيقونات Lucide -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- مكتبة Supabase للاتصال بقاعدة البيانات -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0d1117 0%, #161b22 50%, #0a0c10 100%);
      --glass-bg: rgba(22, 27, 34, 0.65);
      --glass-border: rgba(255, 255, 255, 0.12);
      --primary-cyan: #00f2fe;
      --primary-blue: #4facfe;
      --danger-red: #ff3366;
      --danger-glow: rgba(255, 51, 102, 0.4);
      --warning-amber: #ffb703;
      --text-main: #ffffff;
      --text-muted: #a0aec0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: #080a0f;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
      overflow-x: hidden;
    }

    .app-container {
      width: 100%;
      max-width: 420px;
      background: var(--bg-gradient);
      border-radius: 35px;
      padding: 24px 20px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), 0 0 40px rgba(0, 242, 254, 0.15);
      border: 1px solid var(--glass-border);
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(20px);
    }

    .glow-sphere-1 {
      position: absolute;
      top: -60px;
      right: -60px;
      width: 200px;
      height: 200px;
      background: radial-gradient(circle, rgba(0, 242, 254, 0.3) 0%, transparent 70%);
      z-index: 0;
      pointer-events: none;
    }

    .glow-sphere-2 {
      position: absolute;
      bottom: 100px;
      left: -80px;
      width: 220px;
      height: 220px;
      background: radial-gradient(circle, rgba(255, 51, 102, 0.25) 0%, transparent 70%);
      z-index: 0;
      pointer-events: none;
    }

    .content-wrapper {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .location-box {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .location-title {
      font-size: 1.2rem;
      font-weight: 700;
    }

    .icon-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--glass-border);
      color: #fff;
      width: 42px;
      height: 42px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    /* بطاقة التحذير الطارئ (تظهر تلقائياً من Supabase) */
    .alert-card {
      display: none;
      background: linear-gradient(135deg, rgba(255, 51, 102, 0.2) 0%, rgba(20, 10, 20, 0.6) 100%);
      border: 1px solid var(--danger-red);
      border-radius: 24px;
      padding: 16px 18px;
      box-shadow: 0 10px 25px var(--danger-glow);
      animation: alertPulse 2.5s infinite ease-in-out;
    }

    @keyframes alertPulse {
      0%, 100% { box-shadow: 0 0 15px var(--danger-glow); border-color: rgba(255, 51, 102, 0.8); }
      50% { box-shadow: 0 0 30px rgba(255, 51, 102, 0.8); border-color: #ff3366; }
    }

    .alert-header {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--danger-red);
      font-weight: 800;
      font-size: 1.05rem;
      margin-bottom: 6px;
    }

    .alert-badge {
      background: var(--danger-red);
      color: #fff;
      font-size: 0.7rem;
      padding: 2px 8px;
      border-radius: 8px;
      font-weight: 900;
    }

    .alert-body {
      font-size: 0.9rem;
      color: #ffd6e0;
      line-height: 1.4;
    }

    .main-weather-card {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 28px;
      padding: 25px 20px;
      text-align: center;
      backdrop-filter: blur(15px);
    }

    .weather-icon-wrap {
      width: 90px;
      height: 90px;
      margin: 0 auto 10px auto;
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 0 15px rgba(0, 242, 254, 0.6));
    }

    .temp-number {
      font-size: 3.8rem;
      font-weight: 900;
      background: linear-gradient(180deg, #ffffff 30%, #a0aec0 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1;
      margin-bottom: 5px;
    }

    .weather-status {
      font-size: 1.1rem;
      color: var(--primary-cyan);
      font-weight: 700;
      margin-bottom: 20px;
    }

    .weather-stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      background: rgba(0, 0, 0, 0.25);
      padding: 12px;
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .stat-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .stat-label {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .stat-value {
      font-size: 0.95rem;
      font-weight: 700;
    }

    .ai-assistant-card {
      background: linear-gradient(135deg, rgba(0, 242, 254, 0.12) 0%, rgba(79, 172, 254, 0.05) 100%);
      border: 1px solid rgba(0, 242, 254, 0.3);
      border-radius: 24px;
      padding: 18px;
    }

    .ai-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .ai-icon-box {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--primary-cyan), var(--primary-blue));
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000;
      box-shadow: 0 0 12px rgba(0, 242, 254, 0.5);
    }

    .ai-title {
      font-weight: 700;
      font-size: 1rem;
      color: var(--primary-cyan);
    }

    .ai-advice-text {
      font-size: 0.92rem;
      color: #e2e8f0;
      line-height: 1.5;
      background: rgba(0, 0, 0, 0.2);
      padding: 10px 14px;
      border-radius: 14px;
      border-right: 3px solid var(--primary-cyan);
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="glow-sphere-1"></div>
    <div class="glow-sphere-2"></div>

    <div class="content-wrapper">

      <div class="header">
        <div class="location-box">
          <i data-lucide="map-pin" style="color: var(--primary-cyan);"></i>
          <span class="location-title" id="cityName">جاري تحديد الموقع...</span>
        </div>
        <button class="icon-btn" onclick="fetchWeatherData()">
          <i data-lucide="rotate-cw"></i>
        </button>
      </div>

      <!-- بطاقة التحذير الطارئ (تسحب من Supabase) -->
      <div class="alert-card" id="alertBox">
        <div class="alert-header">
          <i data-lucide="siren"></i>
          <span id="alertTitle">تحذير مناخي طارئ!</span>
          <span class="alert-badge">عاجل</span>
        </div>
        <div class="alert-body" id="alertText">
          جاري التحقق من التحذيرات...
        </div>
      </div>

      <!-- بطاقة الطقس الرئيسية -->
      <div class="main-weather-card">
        <div class="weather-icon-wrap" id="weatherIcon">
          <i data-lucide="cloud-sun" size="70" style="color: var(--primary-cyan);"></i>
        </div>
        <div class="temp-number" id="tempDegree">--°</div>
        <div class="weather-status" id="weatherState">جاري التحميل...</div>

        <div class="weather-stats-grid">
          <div class="stat-item">
            <i data-lucide="wind" size="18" style="color: var(--primary-cyan);"></i>
            <span class="stat-label">الرياح</span>
            <span class="stat-value" id="windSpeed">-- كم/س</span>
          </div>
          <div class="stat-item">
            <i data-lucide="droplets" size="18" style="color: var(--primary-blue);"></i>
            <span class="stat-label">الرطوبة</span>
            <span class="stat-value" id="humidity">--%</span>
          </div>
          <div class="stat-item">
            <i data-lucide="compass" size="18" style="color: var(--warning-amber);"></i>
            <span class="stat-label">الاتجاه</span>
            <span class="stat-value" id="windDir">--</span>
          </div>
        </div>
      </div>

      <!-- بطاقة المساعد الذكي AI -->
      <div class="ai-assistant-card">
        <div class="ai-header">
          <div class="ai-icon-box">
            <i data-lucide="bot" size="20"></i>
          </div>
          <span class="ai-title">المساعد الذكي ينصحك</span>
        </div>
        <div class="ai-advice-text" id="aiAdvice">
          "جاري تحليل حالة الطقس لصياغة النصيحة المناسبة..."
        </div>
      </div>

    </div>
  </div>

  <script>
    lucide.createIcons();

    // 🔑 ربط Supabase بالمشروع الحقيقي
    const SUPABASE_URL = 'https://pueegfwjftltzlvrhyww.supabase.co';
    const SUPABASE_ANON_KEY = 'Sb_publishable_bEHmHW3g4CI7Wjp1D1lhWg_81MK0FS0';
    
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // جلب الطقس الحقيقي
    async function fetchWeatherData() {
      try {
        const response = await fetch('https://api.open-meteo.com/v1/forecast?latitude=24.7136&current=temperature_2m,relative_humidity_2m,wind_speed_10m&timezone=auto');
        const data = await response.json();
        
        const temp = Math.round(data.current.temperature_2m);
        const wind = data.current.wind_speed_10m;
        const humidity = data.current.relative_humidity_2m;
        
        document.getElementById('cityName').innerText = 'الرياض، السعودية';
        document.getElementById('tempDegree').innerText = temp + '°';
        document.getElementById('windSpeed').innerText = wind + ' كم/س';
        document.getElementById('humidity').innerText = humidity + '%';

        // توجيهات ومساعد ذكي يتفاعل حسب درجة الحرارة
        let advice = '';
        if (temp > 40) {
          document.getElementById('weatherState').innerText = 'حرارة شديدة جداً';
          advice = `"درجات الحرارة مرتفعة للغاية (${temp}°م). أنصحك بعدم التعرض مباشرة لأشعة الشمس والإكثار من السوائل لتجنب الإجهاد الحراري."`;
        } else if (temp < 15) {
          document.getElementById('weatherState').innerText = 'برودة قارصة';
          advice = `"الطقس بارد جداً اليوم. ارتدِ ملابس ثقيلة وتدفأ جيداً قبل الخروج."`;
        } else {
          document.getElementById('weatherState').innerText = 'طقس معتدل وجميل';
          advice = `"الطقس رائع ومناسب جداً للخروج وممارسة الأنشطة اليومية. استمتع بيومك!"`;
        }
        document.getElementById('aiAdvice').innerText = advice;

      } catch (error) {
        console.error('خطأ في جلب الطقس:', error);
      }
    }

    // جلب التحذيرات الحية من جدول weather_alerts في Supabase
    async function fetchAlertsFromSupabase() {
      try {
        const { data, error } = await supabaseClient
          .from('weather_alerts')
          .select('*')
          .eq('is_active', true)
          .limit(1);

        if (data && data.length > 0) {
          const alert = data[0];
          document.getElementById('alertBox').style.display = 'block';
          document.getElementById('alertTitle').innerText = alert.title;
          document.getElementById('alertText').innerText = alert.message;
        } else {
          document.getElementById('alertBox').style.display = 'none';
        }
      }كان (err) {
        console.log('خطأ بالاتصال بـ Supabase:', err);
      }
    }

    // التشغيل
    fetchWeatherData();
    fetchAlertsFromSupabase();
  </script>
</body>
</html>
